apiVersion: apps/v1
kind: Deployment
metadata:
  name: mingyuan-web
  labels:
    app.kubernetes.io/name: mingyuan-web
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mingyuan-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mingyuan-web
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: web
          image: clip-registry-vpc.cn-hangzhou.cr.aliyuncs.com/mingyuan/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: mingyuan-web-config
            - secretRef:
                name: mingyuan-web-secrets
          env:
            - name: BACKGROUND_TASKS_ENABLED
              value: "true"
            - name: aliyun_logs_webstdout
              value: "stdout"
            - name: aliyun_logs_webstdout_project
              value: "mingyuan-logs"
            - name: aliyun_logs_webstdout_logstore
              value: "app-logs"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mingyuan-web
  labels:
    app.kubernetes.io/name: mingyuan-web
spec:
  selector:
    app.kubernetes.io/name: mingyuan-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mingyuan-web
  labels:
    app.kubernetes.io/name: mingyuan-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  rules:
    - host: www.aibao365.com.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mingyuan-web
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mingyuan-web-pdb
  labels:
    app.kubernetes.io/name: mingyuan-web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mingyuan-web
