apiVersion: batch/v1
kind: CronJob
metadata:
  name: mingyuan-task-recovery
  labels:
    app.kubernetes.io/name: mingyuan-task-recovery
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mingyuan-task-recovery
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: acr-secret
          containers:
            - name: poll-tasks
              image: clip-registry-vpc.cn-hangzhou.cr.aliyuncs.com/mingyuan/web:latest
              imagePullPolicy: IfNotPresent
              command: ["node", "-e"]
              args:
                - |
                  const http = require('http');
                  const host = process.env.MINGYUAN_WEB_HOST || '120.26.205.132';
                  const req = http.get(`http://${host}/api/cron/poll-tasks`, {
                    headers: { 'Authorization': 'Bearer ' + process.env.CRON_SECRET },
                    timeout: 45000
                  }, res => {
                    let d = ''; res.on('data', c => d += c);
                    res.on('end', () => { console.log('HTTP', res.statusCode, d); process.exit(res.statusCode === 200 ? 0 : 1); });
                  });
                  req.on('error', e => { console.error(e.message); process.exit(1); });
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: mingyuan-web-secrets
                      key: CRON_SECRET
                - name: MINGYUAN_WEB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: mingyuan-cron-config
                      key: WEB_HOST
                      optional: true
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
