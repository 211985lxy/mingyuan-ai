# Hypit 渲染服务 —— k8s 清单（草稿，待审批后落到 k8s/hypit-renderer.yaml）
#
# 形态对齐 k8s/video-extractor.yaml，差异全部来自「它是有状态的长任务渲染器」：
#
# 1. **replicas 恒为 1**。Hypit 的 Runtime 与 CLI 是一对一绑定，同一个 workspace
#    上跑两个实例会互相踩 Runtime 状态（见 README「Runtime 独占」）。
#    因此 strategy 用 Recreate，绝不滚动。
# 2. **需要 PVC**。渲染产物与 Runtime 状态落在 /var/lib/hypit，重建 Pod 不能丢
#    （丢了只是重渲，但 build 历史会断）。
# 3. **terminationGracePeriodSeconds 给足**。渲染中的任务被打断就白跑，
#    给 10 分钟让它把手上这一单渲完。
# 4. **就绪探针要容忍冷启动**。Worker 在 lifespan 里预热（约 5s），
#    加上镜像 6GB 的拉取/解压，initialDelaySeconds 不能照抄 extractor 的 5s。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mingyuan-hypit-renderer-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mingyuan-hypit-renderer-secrets
stringData:
  # 与 web 的 HYPIT_API_TOKEN 必须一致；web 从 mingyuan-web-secrets 读同一个值
  HYPIT_API_TOKEN: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mingyuan-hypit-renderer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mingyuan-hypit-renderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mingyuan-hypit-renderer
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: renderer
          image: clip-registry-vpc.cn-hangzhou.cr.aliyuncs.com/mingyuan/hypit-renderer:latest
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: HYPIT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mingyuan-hypit-renderer-secrets
                  key: HYPIT_API_TOKEN
            - name: HYPIT_BIN
              value: /opt/hypit/bin/hypit
            - name: HYPIT_WORKSPACE_ROOT
              value: /var/lib/hypit/workspace
            - name: HYPIT_ALLOWED_SOURCE_ROOTS
              value: /var/lib/hypit/workspace
            - name: HYPIT_STATE_DIR
              value: /var/lib/hypit/state
            - name: HYPIT_OUTPUT_DIR
              value: /var/lib/hypit/outputs
            - name: WARM_UP_ON_STARTUP
              value: "1"
          volumeMounts:
            - name: state
              mountPath: /var/lib/hypit
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            # 渲染是 CPU 密集：1 条 6s 竖片约 15s wall time（实测容器内）。
            # 限额按需上调，但别把并发（HYPIT_MAX_CONCURRENT）一起调高——
            # 一个 Runtime 只服务一个 CLI，并发 >1 只会排队不会变快。
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: mingyuan-hypit-renderer-state
---
apiVersion: v1
kind: Service
metadata:
  name: mingyuan-hypit-renderer
spec:
  selector:
    app.kubernetes.io/name: mingyuan-hypit-renderer
  ports:
    - name: http
      port: 8787
      targetPort: http
