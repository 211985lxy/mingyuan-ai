[project]
name = "mingyuan-video-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "faster-whisper==1.2.0",
  "f2==0.0.1.7",
  # F19：f2==0.0.1.7 硬 pin httpx==0.27.2，此前本行 pin httpx==0.28.1 导致依赖集
  # 自相矛盾（pip install 永远 ResolutionImpossible，Docker 镜像构建失败）。
  # 放宽为兼容区间，解析落到 0.27.2；app 仅用 AsyncClient/stream/aiter_bytes，0.27/0.28 均兼容。
  "httpx>=0.27.2,<0.29",
  "uvicorn[standard]==0.35.0",
  "yt-dlp>=2025.6.30,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.2",
]
# schemathesis 接口模糊测试（重依赖，独立环境/CI job 安装）
fuzz = [
  "schemathesis>=3.0",
  "hypothesis>=6.100",
]
# CER 评测（可选；cer_eval.py 有纯 Python 回退，不装也能跑单测）
eval = [
  "jiwer>=3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::ResourceWarning",
]
markers = [
  "gpu: 需要 GPU / faster-whisper 的测试（默认跳过）",
  "eval: CER 质量评估门禁（默认跳过）",
]
