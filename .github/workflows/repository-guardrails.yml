name: Repository Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一分支/workflow 只保留最新一次运行：被后续推送取代的旧运行直接取消。
  # 不加 event_name 是有意的——否则手动重跑会与推送并行，等于多跑一份。
  # 参考 2026-09-13 用量排查：约 20% 的 Action 分钟花在被取代的旧运行上。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 分工（2026-09-13 用量排查后调整）：
#   PR  → 全量：单测/覆盖、DB E2E、构件与契约门禁（合并前必须全绿）
#   main→ 快速完整性 + 生产构建门禁：
#         保留 install/prisma/lint/typecheck/env:check/api:contracts/arch:*/db:bounds
#         以及 main 独有的 production build（堵 2026-09-11 飞书组件悬空引用无法发版事故）
#         跳过 test:coverage / test:e2e：同一 tree 已在 PR 阶段跑过，属重复计费
#   手动触发(workflow_dispatch)按全量跑：测试 + 构建都执行
#   代价（已知并接受才启用）：直接推 main 的提交、以及基线过期后再合并的 tree，
#   将不再跑单测与 E2E，仅由 typecheck/arch/契约与生产构建兜底。

jobs:
  quality:
    name: Lint, types, tests, architecture, and harness
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: mingyuan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/mingyuan_test
      TEST_DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/mingyuan_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir apps/web exec prisma generate
      - name: Validate Prisma schema
        run: pnpm --dir apps/web exec prisma validate
      - name: Prepare test database
        if: github.event_name != 'push'  # 仅 main 推送时跳过：同一 tree 已在 PR 阶段全量跑过
        run: pnpm --dir apps/web run test:e2e:prepare
      - name: Lint
        run: pnpm --dir apps/web exec eslint --quiet .
      - name: Typecheck
        run: pnpm --dir apps/web run typecheck
      - name: Typecheck tests
        run: pnpm --dir apps/web run typecheck:tests
      - name: Unit and evaluation tests
        if: github.event_name != 'push'  # 仅 main 推送时跳过：同一 tree 已在 PR 阶段全量跑过
        run: pnpm --dir apps/web run test:coverage
      - name: Upload unit coverage baseline
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: apps/web/coverage/
          if-no-files-found: warn
          retention-days: 30
      - name: Database E2E tests
        if: github.event_name != 'push'  # 仅 main 推送时跳过：同一 tree 已在 PR 阶段全量跑过
        run: pnpm --dir apps/web run test:e2e
      - name: Environment contract
        run: pnpm --dir apps/web run env:check
      - name: API contract inventory
        run: pnpm --dir apps/web run api:contracts
      - name: Architecture size guard
        run: pnpm --dir apps/web run arch:size
      - name: Architecture dependency guard
        run: pnpm --dir apps/web run arch:check
      - name: Domain boundary guard
        run: pnpm --dir apps/web run arch:domains
      - name: Retired capability guard
        run: pnpm --dir apps/web run arch:retired
      - name: Bounded Prisma query guard
        run: pnpm --dir apps/web run db:bounds
      - name: Deterministic harness
        run: pnpm --dir apps/web run test:harness
      # 构建门禁：push 到 main 时跑与 deploy-ecs-standalone.sh 同参的 production build，
      # 堵住「悬空引用/类型坏点进 main 导致无法发版」（2026-09-11 feishu-knowledge 组件悬空引用事故）。
      # PR 上跳过以控制时长（PR 阶段已有全量 tsc/test/arch 门禁）。
      - name: Production build gate (main only)
        if: github.event_name != 'pull_request'
        run: pnpm --dir apps/web exec next build --webpack
