name: video-extractor API fuzz (schemathesis)

on:
  push:
    paths:
      - "services/video-extractor/**"
  pull_request:
    paths:
      - "services/video-extractor/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: services/video-extractor

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # F19 已修（httpx pin 放宽为 >=0.27.2,<0.29），恢复完整声明依赖安装。
      - name: Install fuzz dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev,fuzz]"
      - name: Run schemathesis fuzz (download/transcribe stubbed)
        run: pytest tests/test_schemathesis.py -p no:cacheprovider --timeout=600
