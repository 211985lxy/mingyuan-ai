name: AIM Harness Eval (pre-release full)

# Manual only: all fixtures × 3 reps, rubric ON. Run before release to verify
# the full pass-rate gate (≥85% overall, ≥80% per agent, complete judge
# coverage, no critical fabrication). Does NOT write to the customer database.
on:
  workflow_dispatch:

jobs:
  full-eval:
    name: Full eval (all cases × 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/web exec prisma generate

      - name: Full eval (real model)
        env:
          THEROUTER_API_KEY: ${{ secrets.THEROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIEKOU_API_KEY: ${{ secrets.JIEKOU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          LIHUO_API_KEY: ${{ secrets.LIHUO_API_KEY }}
          DATABASE_URL: mysql://eval:eval@127.0.0.1:3306/aim_eval
        run: |
          pnpm --dir apps/web run eval:full > full-summary.md 2> eval.log
          STATUS=$?
          cat full-summary.md >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 eval.log >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aim-eval-full
          path: apps/web/aim-eval-report/
