name: AIM Harness Eval (model-swap)

# 缺口升级 WP-A2：固定 Harness，对比 strong/weak 路由画像。
# 手动或每周一次；不阻断 PR。产物含 bottleneck 标签。
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  model-swap:
    name: Model-swap report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/web exec prisma generate

      - name: Require at least one model secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          THEROUTER_API_KEY: ${{ secrets.THEROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIEKOU_API_KEY: ${{ secrets.JIEKOU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          LIHUO_API_KEY: ${{ secrets.LIHUO_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}${APIMART_API_KEY}${THEROUTER_API_KEY}${OPENROUTER_API_KEY}${JIEKOU_API_KEY}${GLM_API_KEY}${LIHUO_API_KEY}${ZENMUX_API_KEY}" ]; then
            echo "::error::model-swap 需要至少一个 LLM API Key secret。禁止静默跳过。"
            exit 1
          fi

      - name: Model-swap eval
        env:
          THEROUTER_API_KEY: ${{ secrets.THEROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIEKOU_API_KEY: ${{ secrets.JIEKOU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          LIHUO_API_KEY: ${{ secrets.LIHUO_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          DATABASE_URL: mysql://eval:eval@127.0.0.1:3306/aim_eval
        run: |
          pnpm --dir apps/web run eval:model-swap -- --out=./aim-eval-model-swap > swap-summary.md 2> eval.log
          STATUS=$?
          cat swap-summary.md >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 eval.log >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Upload model-swap report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aim-eval-model-swap
          path: apps/web/aim-eval-model-swap/
