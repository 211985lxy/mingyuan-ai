name: Build & Deploy

# 生产部署实际走 scripts/deploy-ecs-standalone.sh（ECS standalone：本地 build →
# rsync → systemctl 重启 mingyuan-web），不经 ACR/K8s。本 workflow 的 ACR→K8s 链路
# 从未跑通（GitHub Secrets 缺 ACR_USERNAME/ACR_PASSWORD），每次 push main 都触发
# 一次注定失败的 run，纯属噪音。改为手动触发，避免自动失败堆积。
#
# 恢复自动部署：配好 ACR 凭证后，把下方改回
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  ACR_PUBLIC: clip-registry.cn-hangzhou.cr.aliyuncs.com
  ACR_VPC: clip-registry-vpc.cn-hangzhou.cr.aliyuncs.com
  ACR_NAMESPACE: mingyuan

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: mingyuan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/mingyuan_test
      TEST_DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/mingyuan_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm security:audit
      - name: Generate Prisma client
        run: pnpm --dir apps/web exec prisma generate
      - name: Validate Prisma schema
        run: pnpm --dir apps/web exec prisma validate
      - name: Prepare test database
        run: pnpm --dir apps/web run test:e2e:prepare
      - name: Typecheck
        run: pnpm --dir apps/web exec tsc --noEmit
      - name: Typecheck tests
        run: pnpm --dir apps/web run typecheck:tests
      - name: Environment contract
        run: pnpm --dir apps/web run env:check
      - name: API contract inventory
        run: pnpm --dir apps/web run api:contracts
      - name: Lint
        run: pnpm --dir apps/web exec eslint --quiet .
      - name: Unit and evaluation tests
        run: pnpm --dir apps/web test
      - name: Database E2E tests
        run: pnpm --dir apps/web run test:e2e
      - name: Architecture size guard
        run: pnpm --dir apps/web run arch:size
      - name: Architecture dependency guard
        run: pnpm --dir apps/web run arch:check
      - name: Domain boundary guard
        run: pnpm --dir apps/web run arch:domains
      - name: Retired capability guard
        run: pnpm --dir apps/web run arch:retired
      - name: Bounded Prisma query guard
        run: pnpm --dir apps/web run db:bounds
      - name: Deterministic harness
        run: pnpm --dir apps/web run test:harness

  # 缺口升级 WP-A1：main 发布必须过真实模型 daily 门禁；密钥缺失时失败（禁止静默跳过）
  real-model-eval:
    name: Real-model daily eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir apps/web exec prisma generate
      - name: Require model secret or signed-off daily-eval skip
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          THEROUTER_API_KEY: ${{ secrets.THEROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIEKOU_API_KEY: ${{ secrets.JIEKOU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          LIHUO_API_KEY: ${{ secrets.LIHUO_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          AIM_RELEASE_SKIP_DAILY_EVAL_SIGNED_OFF_BY: ${{ vars.AIM_RELEASE_SKIP_DAILY_EVAL_SIGNED_OFF_BY }}
        run: |
          if [ -n "${DEEPSEEK_API_KEY}${APIMART_API_KEY}${THEROUTER_API_KEY}${OPENROUTER_API_KEY}${JIEKOU_API_KEY}${GLM_API_KEY}${LIHUO_API_KEY}${ZENMUX_API_KEY}" ]; then
            echo "has_model_secret=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "${AIM_RELEASE_SKIP_DAILY_EVAL_SIGNED_OFF_BY}" ]; then
            echo "::warning::真实模型 daily eval 已按业务签核临时跳过：${AIM_RELEASE_SKIP_DAILY_EVAL_SIGNED_OFF_BY}"
            echo "skip_daily_eval=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::真实模型评估门禁需要至少一个 LLM API Key secret，或设置 vars.AIM_RELEASE_SKIP_DAILY_EVAL_SIGNED_OFF_BY。"
          exit 1
      - name: Daily eval (real model)
        if: env.skip_daily_eval != 'true'
        env:
          THEROUTER_API_KEY: ${{ secrets.THEROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIEKOU_API_KEY: ${{ secrets.JIEKOU_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          LIHUO_API_KEY: ${{ secrets.LIHUO_API_KEY }}
          APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          DATABASE_URL: mysql://eval:eval@127.0.0.1:3306/aim_eval
        run: |
          pnpm --dir apps/web run eval:daily > daily-summary.md 2> eval.log
          STATUS=$?
          cat daily-summary.md >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 eval.log >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS
      - name: Record signed-off daily-eval skip
        if: env.skip_daily_eval == 'true'
        run: |
          {
            echo "## Daily eval skipped (signed off)"
            echo
            echo "Signed off by: \`${{ vars.AIM_RELEASE_SKIP_DAILY_EVAL_SIGNED_OFF_BY }}\`"
            echo
            echo "This is not release evidence. Configure LLM secrets and clear the skip var."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload daily eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aim-eval-daily-release-gate
          path: apps/web/aim-eval-report/

  build-and-push:
    needs: [quality, real-model-eval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR (public endpoint)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_PUBLIC }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: web-runner
          push: true
          platforms: linux/amd64
          tags: ${{ env.ACR_PUBLIC }}/${{ env.ACR_NAMESPACE }}/web:${{ github.sha }}

  migrate:
    name: Prisma Migrate Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir apps/web exec prisma generate
      - name: Preflight retired-media migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACK_RETIRE_MEDIA_DATA: ${{ secrets.ACK_RETIRE_MEDIA_DATA }}
          RETIRED_MEDIA_BACKUP_REFERENCE: ${{ secrets.RETIRED_MEDIA_BACKUP_REFERENCE }}
        run: pnpm --dir apps/web run schema:retired-media-preflight
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: apps/web
        run: pnpm exec prisma migrate deploy
      - name: Verify schema is up to date
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: apps/web
        run: |
          set -o pipefail
          output="$(pnpm exec prisma migrate status 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$output" | grep -F "Database schema is up to date"
      - name: Verify production schema matches Prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: apps/web
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma --exit-code

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to K8s
        run: |
          kubectl set image deployment/mingyuan-web web=${{ env.ACR_VPC }}/${{ env.ACR_NAMESPACE }}/web:${{ github.sha }}
          kubectl rollout status deployment/mingyuan-web --timeout=180s

      - name: Verify live health dependencies
        run: |
          set -euo pipefail
          kubectl port-forward service/mingyuan-web 18080:80 >/tmp/mingyuan-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/healthz > health.json; then
              grep -q '"ok":true' health.json
              cat health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mingyuan-port-forward.log
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rollout failed, rolling back..."
          kubectl rollout undo deployment/mingyuan-web
          exit 1

  promote-stable:
    name: Promote stable image tags
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Login to ACR (public endpoint)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_PUBLIC }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Promote deployed SHA to latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.ACR_PUBLIC }}/${{ env.ACR_NAMESPACE }}/web:latest \
            ${{ env.ACR_PUBLIC }}/${{ env.ACR_NAMESPACE }}/web:${{ github.sha }}
